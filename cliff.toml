# git-cliff configuration (Keep a Changelog layout, Conventional Commits input).
# https://git-cliff.org

[changelog]
# Rendered changelog header.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Template for the changelog body.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\
{% else %}\
    ## [Unreleased]\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\n\n\
    ### {{ group | upper_first }}\n\
    {% for commit in commits %}\
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}\n\
{% endfor %}\n
"""

# Rendered changelog footer.
footer = """
<!-- generated by git-cliff -->
"""

# Remove leading/trailing whitespace from the changelog body.
trim = true

[git]
# Parse commits following Conventional Commits.
conventional_commits = true
# Exclude commits that do not parse as conventional.
filter_unconventional = true
# Process each line of a merge commit message.
split_commits = false
# Keep commits with a breaking change even if filtered otherwise.
protect_breaking_commits = true

# Map conventional commit types onto Keep a Changelog sections.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore\\(deps", group = "Dependencies" },
    { message = "^chore\\(release", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^revert", group = "Reverted" },
    { message = ".*", skip = true },
]

# Ignore merge commits.
filter_commits = false
# Only consider tags matching this pattern.
tag_pattern = "v[0-9]*"
# Order the top of the changelog by the most recent tag/commit.
topo_order = false
sort_commits = "oldest"
