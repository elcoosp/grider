# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Unmaintained *transitive* dependencies that we cannot fix without upstream
# releases. Revisit whenever `image` / `imageproc` publish new versions:
# - RUSTSEC-2024-0436 (paste): pulled by `pulp`/`rav1e` via `image`.
# - RUSTSEC-2026-0192 (ttf-parser): pulled by `ab_glyph` via `imageproc`.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# List of explicitly allowed licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
# Lint (warn) on multiple versions of the same crate, deny only on wildcards.
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
